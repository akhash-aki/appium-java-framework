# Server Configuration
appium.server.url=http://127.0.0.1:4723

# Default Platform (ANDROID or IOS)
platform.name=ANDROID

# Timeouts (seconds)
explicit.wait.seconds=15
implicit.wait.seconds=0

# Android Capabilities (UiAutomator2)
android.device.name=Pixel_7_Pro_API_34
android.automation.name=UiAutomator2
android.app.package=com.swaglabsmobileapp
android.app.activity=com.swaglabsmobileapp.MainActivity
# android.app.path=src/test/resources/apps/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
android.auto.grant.permissions=true
android.no.reset=true

# iOS Capabilities (XCUITest)
ios.device.name=iPhone 15 Pro
ios.platform.version=17.2
ios.automation.name=XCUITest
ios.bundle.id=com.saucelabs.SwagLabsMobileApp
ios.app.path=src/test/resources/apps/sauce-labs-sample-app.app
ios.no.reset=false

# Reporting Configuration
report.title=Mobile Test Automation Execution Report
report.name=Appium 2.x Automation Suite
report.theme=DARK
override.reports=no
